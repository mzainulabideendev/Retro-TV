name: Linux Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+*'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

env:
  FLUTTER_VERSION: '3.47.2'

jobs:
  resolve-version:
    runs-on: ubuntu-latest
    outputs:
      name: ${{ steps.version.outputs.name }}
      code: ${{ steps.version.outputs.code }}
      full: ${{ steps.version.outputs.full }}
    steps:
      - uses: actions/checkout@v4
      - id: version
        run: |
          line="$(grep -E '^version:' pubspec.yaml | head -n1)"
          full="$(echo "$line" | sed -E 's/^version:[[:space:]]*//; s/[[:space:]]*$//')"
          name="${full%%+*}"
          code="${full##*+}"
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "full=$full" >> "$GITHUB_OUTPUT"
          tag="${GITHUB_REF_NAME#v}"
          if [ "$tag" != "$name" ]; then
            echo "::warning::release tag $GITHUB_REF_NAME does not match pubspec version $full"
          fi

  test-build-linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            build-essential clang cmake ninja-build pkg-config \
            libgtk-3-dev liblzma-dev libstdc++-13-dev libmpv-dev xvfb
      - name: Dependencies
        run: flutter pub get
      - name: Analyze
        run: flutter analyze --fatal-infos --fatal-warnings
      - name: Test
        run: flutter test
      - name: Build Linux (release)
        run: bash scripts/build-linux.sh
      - name: Headless launch smoke test
        run: bash scripts/launch-smoke-test.sh
      - uses: actions/upload-artifact@v4
        with:
          name: linux-bundle
          path: build/linux/x64/release/bundle
          if-no-files-found: error

  package-deb:
    needs: test-build-linux
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: linux-bundle
          path: build/linux/x64/release/bundle
      - name: Restore executable bits
        run: |
          # artifacts do not preserve the executable bit
          chmod +x build/linux/x64/release/bundle/retro_tv
          find build/linux/x64/release/bundle/lib -type f -name '*.so*' -exec chmod +x {} +
      - name: Install dpkg tooling
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq dpkg-dev patchelf
      - name: Build .deb
        run: bash scripts/build-deb.sh
      - uses: actions/upload-artifact@v4
        with:
          name: deb
          path: build/packages/retro-tv_*.deb
          if-no-files-found: error

  package-rpm:
    needs: test-build-linux
    runs-on: ubuntu-24.04
    container: fedora:42
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: linux-bundle
          path: build/linux/x64/release/bundle
      - name: Restore executable bits
        run: |
          chmod +x build/linux/x64/release/bundle/retro_tv
          find build/linux/x64/release/bundle/lib -type f -name '*.so*' -exec chmod +x {} +
      - name: Install rpm-build
        run: dnf -y install rpm-build patchelf elfutils elfutils-devel
      - name: Build .rpm
        run: bash scripts/build-rpm.sh
      - uses: actions/upload-artifact@v4
        with:
          name: rpm
          path: build/packages/retro-tv-*.rpm
          if-no-files-found: error

  # Arch: rebuilds Flutter from source in the archlinux container (the same
  # PKGBUILD published to the AUR), then installs the built package and checks
  # the executable. Non-blocking: failures do not hold back the main release.
  package-arch:
    needs: test-build-linux
    runs-on: ubuntu-24.04
    container: archlinux:latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain
        run: |
          pacman -Sy --noconfirm --needed base-devel fakeroot clang cmake ninja git patchelf sudo
          # runtime deps so makepkg's dependency check can resolve them
          # (Arch's 'mpv' package provides libmpv.so=2-64)
          pacman -S --noconfirm --needed gtk3 mpv
          # Arch ships no binary 'flutter' package, so install the official SDK
          # tarball (same version every other job uses) into /opt.
          curl -fsSL "https://storage.googleapis.com/flutter_infra_release/releases/stable/linux/flutter_linux_${FLUTTER_VERSION}-stable.tar.xz" -o /tmp/flutter.tar.xz
          mkdir -p /opt/flutter-sdk
          tar -xJf /tmp/flutter.tar.xz -C /opt/flutter-sdk --strip-components=1
          git config --global --add safe.directory /opt/flutter-sdk
          git config --global --add safe.directory '*'
          /opt/flutter-sdk/bin/flutter --version
      - name: Prepare build user and verify Flutter access
        run: |
          useradd -m build
          chown -R build:build "$GITHUB_WORKSPACE"
          # Make Flutter SDK owned by build user so git doesn't complain about ownership
          chown -R build:build /opt/flutter-sdk
          # Configure git safe.directory for the build user (Flutter internally uses git)
          sudo -u build -H git config --global --add safe.directory /opt/flutter-sdk
          sudo -u build -H git config --global --add safe.directory '*'
          # Verify git can access the Flutter SDK as the build user
          sudo -u build -H git -C /opt/flutter-sdk rev-parse --is-inside-work-tree
          # Verify Flutter runs as the build user
          sudo -u build -H /opt/flutter-sdk/bin/flutter --version
      - name: Build PKGBUILD (non-root)
        run: |
          sudo -u build -H bash -c "export PATH=/opt/flutter-sdk/bin:\$PATH; export PUB_CACHE='$GITHUB_WORKSPACE/.pub-cache'; cd '$GITHUB_WORKSPACE' && bash scripts/build-arch.sh"
      - name: Install and verify executable (pacman)
        run: |
          pacman -U --noconfirm build/packages/retro-tv-*.pkg.tar.zst
          test -x /usr/bin/retro_tv || exit 1
          test -x /usr/lib/retro-tv/retro_tv || exit 1
          pacman -Rns --noconfirm retro-tv
          echo "ARCH INSTALL TEST PASS"
      - uses: actions/upload-artifact@v4
        with:
          name: arch
          path: build/packages/retro-tv-*.pkg.tar.zst
          if-no-files-found: warn

  package-flatpak:
    needs: package-deb
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: deb
          path: build/packages
      - name: Install Flatpak tooling
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq flatpak flatpak-builder xvfb dbus
      - name: Build Flatpak
        run: bash scripts/build-flatpak.sh
      - name: Headless Flatpak smoke test (best-effort)
        continue-on-error: true
        run: bash scripts/flatpak-smoke-test.sh build/packages/RetroTV-*.flatpak
      - uses: actions/upload-artifact@v4
        with:
          name: flatpak
          path: build/packages/RetroTV-*.flatpak
          if-no-files-found: error

  # Signs everything, keeps nothing unpublished: repository generation, GPG
  # signing, artifact verification and the full Debian install test happen
  # here BEFORE any publication step runs.
  sign-and-verify:
    needs: [resolve-version, package-deb, package-rpm, package-flatpak]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: deb
          path: build/packages
      - uses: actions/download-artifact@v4
        with:
          name: rpm
          path: build/packages
      - uses: actions/download-artifact@v4
        with:
          name: flatpak
          path: build/packages
      - name: Install repository tooling
        run: |
          set -euo pipefail
          echo "[build] Ubuntu release:"
          cat /etc/os-release
          echo "[build] Architecture:"
          dpkg --print-architecture
          echo "[build] Checking apt sources..."
          grep -Rhv '^[[:space:]]*#' /etc/apt/sources.list /etc/apt/sources.list.d/*.list 2>/dev/null || true
          
          echo "[build] Updating apt metadata..."
          sudo apt-get update
          
          echo "[build] Checking dpkg-sig availability in Ubuntu 24.04 repos..."
          if apt-cache policy dpkg-sig 2>/dev/null | grep -q "Candidate: (none)"; then
            echo "[build] dpkg-sig not in Ubuntu 24.04 repos, building from Debian source..."
            # Install build dependencies
            sudo apt-get install -y --no-install-recommends build-essential debhelper devscripts
            
            echo "[build] Downloading dpkg-sig source from Debian archive..."
            cd /tmp
            wget -q --timeout=60 --tries=3 \
              "http://deb.debian.org/debian/pool/main/d/dpkg-sig/dpkg-sig_0.13.1+git20210118.orig.tar.xz" \
              -O dpkg-sig_0.13.1+git20210118.orig.tar.xz || {
                echo "ERROR: Failed to download dpkg-sig source" >&2
                exit 1
              }
            
            wget -q --timeout=30 --tries=3 \
              "https://deb.debian.org/debian/pool/main/d/dpkg-sig/dpkg-sig_0.13.1+git20210118-1.dsc" \
              -O dpkg-sig.dsc || {
                echo "ERROR: Failed to download dpkg-sig dsc" >&2
                exit 1
              }
            
            wget -q --timeout=30 --tries=3 \
              "https://deb.debian.org/debian/pool/main/d/dpkg-sig/dpkg-sig_0.13.1+git20210118-1.debian.tar.xz" \
              -O dpkg-sig_0.13.1+git20210118-1.debian.tar.xz || {
                echo "ERROR: Failed to download dpkg-sig debian.tar.xz" >&2
                exit 1
              }
            
            dpkg-source -x dpkg-sig.dsc
            cd dpkg-sig-*/
            dpkg-buildpackage -us -uc -b
            sudo dpkg -i ../dpkg-sig_*.deb
          
          echo "[build] Verifying repository tooling..."
          command -v gpg >/dev/null 2>&1 || {
            echo "::error::gpg is missing"
            exit 1
          }
          command -v rpm >/dev/null 2>&1 || {
            echo "::error::rpm is missing"
            exit 1
          }
          command -v createrepo_c >/dev/null 2>&1 || {
            echo "::error::createrepo_c is missing"
            exit 1
          }
          command -v apt-ftparchive >/dev/null 2>&1 || {
            echo "::error::apt-ftparchive is missing"
            exit 1
          }
          command -v dpkg-sig >/dev/null 2>&1 || {
            echo "::error::dpkg-sig is missing"
            exit 1
          }
          echo "[build] Repository tooling verified"
      - name: Import GPG signing key
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_KEY_ID: ${{ secrets.GPG_KEY_ID }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: bash scripts/setup-gpg.sh
      - name: Sign .deb (dpkg-sig)
        env:
          GPG_KEY_ID: ${{ secrets.GPG_KEY_ID }}
        run: |
          shopt -s nullglob
          for f in build/packages/retro-tv_*.deb; do
            dpkg-sig --sign builder -k "$GPG_KEY_ID" "$f"
          done
      - name: Sign .rpm (rpmsign)
        env:
          GPG_KEY_ID: ${{ secrets.GPG_KEY_ID }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          shopt -s nullglob
          for f in build/packages/retro-tv-*.rpm; do
            rpmsign --define "%_gpg_name $GPG_KEY_ID" --define "%_gpg_passphrase $GPG_PASSPHRASE" --addsign "$f"
          done
      - name: Generate SHA256SUMS
        run: |
          shopt -s nullglob
          cd build/packages
          sha256sum *.deb *.rpm *.flatpak > SHA256SUMS
          cat SHA256SUMS
      - name: Generate signed APT repository
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_KEY_ID: ${{ secrets.GPG_KEY_ID }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: bash scripts/generate-apt-repository.sh
      - name: Generate signed DNF repository
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_KEY_ID: ${{ secrets.GPG_KEY_ID }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: bash scripts/generate-dnf-repository.sh
      - name: Verify release artifacts
        run: bash scripts/verify-release.sh
      - name: Debian/Ubuntu end-to-end install test
        env:
          NV: ${{ needs.resolve-version.outputs.name }}
          NC: ${{ needs.resolve-version.outputs.code }}
        run: |
          sudo bash scripts/test-apt-install.sh "$PWD/build/repository/apt" "$NV" "$NC"
      - uses: actions/upload-artifact@v4
        with:
          name: repository
          path: build/repository
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: packages
          path: build/packages
          if-no-files-found: error

  # Fedora/RHEL install test in a real fedora container. Runs AFTER signing so
  # it validates the exact signed repository that will be published.
  test-fedora-install:
    needs: sign-and-verify
    runs-on: ubuntu-24.04
    container: fedora:42
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: repository
          path: build/repository
      - name: Fedora end-to-end install test
        run: bash scripts/test-dnf-install.sh "$PWD/build/repository/dnf"

  publish:
    needs: [resolve-version, sign-and-verify, test-fedora-install]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: repository
          path: build/repository
      - uses: actions/download-artifact@v4
        with:
          name: packages
          path: build/packages
      - name: Assemble GitHub Pages site
        run: bash scripts/generate-ghpages.sh
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/gh-pages
      - name: Publish Pages
        uses: actions/deploy-pages@v4
      - name: Create GitHub Release with assets
        uses: softprops/action-gh-release@v2
        with:
          name: Retro TV ${{ needs.resolve-version.outputs.full }}
          body: >
            Linux release ${{ needs.resolve-version.outputs.full }} (amd64).
            Install instructions: https://mzainulabideendev.github.io/Retro-TV/
          files: |
            build/packages/*.deb
            build/packages/*.rpm
            build/packages/*.flatpak
            build/packages/SHA256SUMS
          draft: false
          prerelease: false