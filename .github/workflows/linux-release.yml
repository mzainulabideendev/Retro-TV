name: Linux Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+*'
  workflow_dispatch:
    inputs:
      # CI SAFETY GATE. Defaults to false so a manual run is validation-only and
      # cannot create a public GitHub Release or overwrite the live GitHub Pages
      # site. When enabled on a branch, the workflow creates a new version tag
      # before publishing. Tag pushes always publish as usual.
      publish_release:
        description: 'Publish the GitHub Release + GitHub Pages. Leave false for CI validation runs.'
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

env:
  FLUTTER_VERSION: '3.47.2'

jobs:
  resolve-version:
    runs-on: ubuntu-latest
    outputs:
      name: ${{ steps.version.outputs.name }}
      code: ${{ steps.version.outputs.code }}
      full: ${{ steps.version.outputs.full }}
    steps:
      - uses: actions/checkout@v4
      - id: version
        run: |
          # Decide where the version comes from BEFORE validating anything.
          # On workflow_dispatch, GITHUB_REF_NAME is a BRANCH name, never a
          # release tag, so comparing it against the pubspec version produces a
          # misleading "release tag ... does not match" warning. Only a real
          # tag push is a release.
          if [ "$GITHUB_EVENT_NAME" = "push" ] && [ "$GITHUB_REF_TYPE" = "tag" ]; then
            source="release tag"
          else
            source="pubspec.yaml"
          fi

          line="$(grep -E '^version:' pubspec.yaml | head -n1)"
          full="$(echo "$line" | sed -E 's/^version:[[:space:]]*//; s/[[:space:]]*$//')"
          name="${full%%+*}"
          code="${full##*+}"

          echo "EVENT:          $GITHUB_EVENT_NAME"
          echo "REF:            $GITHUB_REF"
          echo "REF_NAME:       $GITHUB_REF_NAME"
          echo "REF_TYPE:       $GITHUB_REF_TYPE"
          echo "VERSION SOURCE: $source"
          echo "VERSION:        $full (name=$name code=$code)"

          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "full=$full" >> "$GITHUB_OUTPUT"

          # Release-tag validation runs ONLY for a real tag push, and its
          # behaviour is unchanged from the original workflow: a mismatch is
          # reported as a warning, exactly as before. Nothing here can fail the
          # job, so production tag releases behave precisely as they did.
          if [ "$source" = "release tag" ]; then
            tag="${GITHUB_REF_NAME#v}"
            if [ "$tag" != "$name" ]; then
              echo "::warning::release tag $GITHUB_REF_NAME does not match pubspec version $full"
            fi
          else
            echo "[version] $GITHUB_EVENT_NAME on '$GITHUB_REF_NAME' is not a release tag push; using pubspec version $full (tag validation skipped)"
          fi

  test-build-linux:
    needs: resolve-version
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Archive source for Arch package build
        env:
          NV: ${{ needs.resolve-version.outputs.name }}
        run: |
          mkdir -p build
          git archive --format=tar.gz --prefix="Retro-TV-${NV}/" HEAD > build/retro-tv-ci-source.tar.gz
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            build-essential clang cmake ninja-build pkg-config \
            libgtk-3-dev liblzma-dev libstdc++-13-dev libmpv-dev xvfb
      - name: Dependencies
        run: flutter pub get
      - name: Analyze
        run: flutter analyze --fatal-infos --fatal-warnings
      - name: Test
        run: flutter test
      - name: Build Linux (release)
        run: bash scripts/build-linux.sh
      - name: Headless launch smoke test
        run: bash scripts/launch-smoke-test.sh
      - uses: actions/upload-artifact@v4
        with:
          name: linux-bundle
          path: build/linux/x64/release/bundle
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: arch-source
          path: build/retro-tv-ci-source.tar.gz
          if-no-files-found: error

  package-deb:
    needs: test-build-linux
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: linux-bundle
          path: build/linux/x64/release/bundle
      - name: Restore executable bits
        run: |
          # artifacts do not preserve the executable bit
          chmod +x build/linux/x64/release/bundle/retro_tv
          find build/linux/x64/release/bundle/lib -type f -name '*.so*' -exec chmod +x {} +
      - name: Install dpkg tooling
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq dpkg-dev patchelf
      - name: Build .deb
        run: bash scripts/build-deb.sh
      - uses: actions/upload-artifact@v4
        with:
          name: deb
          path: build/packages/retro-tv_*.deb
          if-no-files-found: error

  package-rpm:
    needs: test-build-linux
    runs-on: ubuntu-24.04
    container: fedora:42
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: linux-bundle
          path: build/linux/x64/release/bundle
      - name: Restore executable bits
        run: |
          chmod +x build/linux/x64/release/bundle/retro_tv
          find build/linux/x64/release/bundle/lib -type f -name '*.so*' -exec chmod +x {} +
      - name: Install rpm-build
        run: dnf -y install rpm-build patchelf elfutils elfutils-devel
      - name: Build .rpm
        run: bash scripts/build-rpm.sh
      - uses: actions/upload-artifact@v4
        with:
          name: rpm
          path: build/packages/retro-tv-*.rpm
          if-no-files-found: error

  # Arch: rebuilds Flutter from source in the archlinux container (the same
  # PKGBUILD published to the AUR), then installs the built package and checks
  # the executable. Non-blocking: failures do not hold back the main release.
  package-arch:
    needs: [resolve-version, test-build-linux]
    runs-on: ubuntu-24.04
    container: archlinux:latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: arch-source
          path: build
      - name: Install toolchain
        run: |
          pacman -Sy --noconfirm --needed base-devel fakeroot clang cmake ninja git patchelf sudo
          # runtime deps so makepkg's dependency check can resolve them
          # (Arch's 'mpv' package provides libmpv.so=2-64)
          pacman -S --noconfirm --needed gtk3 mpv
          # Arch ships no binary 'flutter' package, so install the official SDK
          # tarball (same version every other job uses) into /opt.
          curl -fsSL "https://storage.googleapis.com/flutter_infra_release/releases/stable/linux/flutter_linux_${FLUTTER_VERSION}-stable.tar.xz" -o /tmp/flutter.tar.xz
          mkdir -p /opt/flutter-sdk
          tar -xJf /tmp/flutter.tar.xz -C /opt/flutter-sdk --strip-components=1
          git config --global --add safe.directory /opt/flutter-sdk
          git config --global --add safe.directory '*'
          /opt/flutter-sdk/bin/flutter --version
      - name: Prepare build user and verify Flutter access
        env:
          NV: ${{ needs.resolve-version.outputs.name }}
        run: |
          useradd -m build
          chown -R build:build "$GITHUB_WORKSPACE"
          # Make Flutter SDK owned by build user so git doesn't complain about ownership
          chown -R build:build /opt/flutter-sdk
          # Configure git safe.directory for the build user (Flutter internally uses git)
          sudo -u build -H git config --global --add safe.directory /opt/flutter-sdk
          sudo -u build -H git config --global --add safe.directory '*'
          # Verify git can access the Flutter SDK as the build user
          sudo -u build -H git -C /opt/flutter-sdk rev-parse --is-inside-work-tree
          # Verify Flutter runs as the build user
          sudo -u build -H /opt/flutter-sdk/bin/flutter --version
          # The source archive comes from the checkout job because this
          # container workspace does not retain Git metadata.
          test -s "$GITHUB_WORKSPACE/build/retro-tv-ci-source.tar.gz"
          chown build:build "$GITHUB_WORKSPACE/retro-tv-ci-source.tar.gz"
      - name: Build PKGBUILD (non-root)
        run: |
          sudo -u build -H bash -c "export PATH=/opt/flutter-sdk/bin:\$PATH; export PUB_CACHE='$GITHUB_WORKSPACE/.pub-cache'; export RETRO_TV_SOURCE_ARCHIVE='$GITHUB_WORKSPACE/retro-tv-ci-source.tar.gz'; cd '$GITHUB_WORKSPACE' && bash scripts/build-arch.sh"
      - name: Install and verify executable (pacman)
        run: |
          pacman -U --noconfirm build/packages/retro-tv-*.pkg.tar.zst
          test -x /usr/bin/retro_tv || exit 1
          test -x /usr/lib/retro-tv/retro_tv || exit 1
          pacman -Rns --noconfirm retro-tv
          echo "ARCH INSTALL TEST PASS"
      - uses: actions/upload-artifact@v4
        with:
          name: arch
          path: build/packages/retro-tv-*.pkg.tar.zst
          if-no-files-found: warn

  package-flatpak:
    needs: package-deb
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: deb
          path: build/packages
      - name: Install Flatpak tooling
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq flatpak flatpak-builder xvfb dbus
      - name: Build Flatpak
        run: bash scripts/build-flatpak.sh
      - name: Headless Flatpak smoke test (best-effort)
        continue-on-error: true
        run: bash scripts/flatpak-smoke-test.sh build/packages/RetroTV-*.flatpak
      - uses: actions/upload-artifact@v4
        with:
          name: flatpak
          path: build/packages/RetroTV-*.flatpak
          if-no-files-found: error

  # Signs everything, keeps nothing unpublished: repository generation, GPG
  # signing, artifact verification and the full Debian install test happen
  # here BEFORE any publication step runs.
  #
  # This job runs inside a Debian container on purpose. dpkg-sig was dropped from
  # Ubuntu after 22.04 (jammy) and is also absent from Debian bookworm and
  # trixie, so no ubuntu-24.04/latest or bookworm/trixie image can install it.
  # Debian bullseye still ships dpkg-sig 0.13.1+nmu4, so a bullseye container
  # gives us a real dpkg-sig for both .deb signing and signature verification
  # via a plain apt install - no mirror, no pinned .deb URL, no source build.
  #
  # APT SOURCES ARE PINNED TO A FIXED DEBIAN SNAPSHOT (DEB_SNAPSHOT below).
  #
  # Why pinned: Bullseye reached EOL on 2026-08-31. The live
  # deb.debian.org/debian-security Bullseye index still advertises package
  # versions whose .deb files now return HTTP 404, so `apt-get install` dies
  # on perl, perl-modules-5.32, libperl5.32, openssl, ca-certificates,
  # libnghttp2-14, libcurl3-gnutls, libexpat1, git, git-man and sudo.
  #
  # Why a snapshot: snapshot.debian.org is official Debian infrastructure and is
  # immutable, so one fixed timestamp resolves to the same bytes forever. That
  # makes this signing environment reproducible and keeps the bootstrap working
  # months from now instead of depending on a post-EOL archive that is still
  # being edited. It replaces the now-broken live Bullseye security repository.
  #
  # Why 20260831T000000Z: it is the newest capture at which the COMPLETE
  # Bullseye security pool is still on disk. Captures from 20260910 onward
  # publish a bullseye-security Release whose package files are already gone.
  # At this pin the highest version of every package these two steps install
  # was resolved out of the signed indices and its pool .deb was fetched
  # successfully:
  #   dpkg-sig 0.13.1+nmu4, gnupg/gpg/gpgv/dirmngr 2.2.27-2+deb11u3,
  #   perl/perl-base/perl-modules-5.32/libperl5.32 5.32.1-4+deb11u5,
  #   ca-certificates 20250419~deb12u1~deb11u1,
  #   git/git-man 1:2.30.2-1+deb11u5, sudo 1.9.5p2-3+deb11u4,
  #   file 1:5.39-3+deb11u1, rpm 4.16.1.2+dfsg1-3, createrepo-c 0.17.0-1,
  #   apt-utils 2.2.4.
  #
  # Valid-Until: the bullseye-security Release at this pin carries
  # "Valid-Until: 06 Sep 2026", which has already passed, so the single
  # `apt-get update` below is invoked with -o Acquire::Check-Valid-Until=false.
  # That option is passed on that one command line only and is never written to
  # any apt config file, so it cannot leak into unrelated apt operations. It
  # only suppresses a freshness assertion - it does NOT weaken authenticity:
  # apt still fetches and verifies the GPG-signed Release/InRelease against
  # /usr/share/keyrings/debian-archive-keyring.gpg. There is no [trusted=yes],
  # no Acquire::AllowInsecureRepositories and no --allow-unauthenticated.
  sign-and-verify:
    needs: [resolve-version, package-deb, package-rpm, package-flatpak]
    runs-on: ubuntu-latest
    container:
      image: debian:bullseye-slim
    # Bash must be requested explicitly. Without this, run: steps inside a
    # container job fall back to the runner default, which resolved to
    # "sh -e {0}" (dash) here, and dash's set has no -o pipefail. That killed
    # the bootstrap step on its very first line with
    # "set: Illegal option -o pipefail" (exit 2) before apt ever ran.
    # The steps below are written for bash (set -euo pipefail, [[ ]]), so the
    # correct fix is to declare bash - not to rewrite them as POSIX sh.
    defaults:
      run:
        shell: bash
    env:
      # Fixed, immutable snapshot.debian.org capture. See the comment above.
      DEB_SNAPSHOT: '20260831T000000Z'
    steps:
      # debian:bullseye-slim is a bare image. git is required by
      # actions/checkout, sudo by the steps below (kept for consistency with the
      # non-container jobs), file by scripts/test-apt-install.sh and
      # ca-certificates by the HTTPS calls the actions make over the network.
      - name: Bootstrap container tooling
        run: |
          set -euo pipefail
          echo "=== [bootstrap] container identity ==="
          cat /etc/os-release
          echo "arch: $(dpkg --print-architecture) ($(uname -m))"
          echo
          echo "=== [bootstrap] apt sources shipped in the image (pre-existing) ==="
          cat /etc/apt/sources.list 2>/dev/null || true
          ls -1 /etc/apt/sources.list.d/ 2>/dev/null || true
          echo
          echo "=== [bootstrap] selected Debian snapshot: ${DEB_SNAPSHOT} ==="
          # http:// on purpose: this slim image has no CA bundle before the
          # first update, and snapshot.debian.org serves http without
          # upgrading to https. Authenticity comes from the GPG-signed
          # Release/InRelease, which apt verifies below.
          # The security component must be "main", NOT "updates/main".
          # The signed bullseye-security Release at this pin advertises
          #   Components: updates/main updates/contrib updates/non-free
          # but its MD5Sum/SHA1/SHA256 sections only carry hashes for index
          # paths under  main/, contrib/ and non-free/  - there is no
          # "updates/main/binary-amd64/Packages*" entry. snapshot.debian.org
          # does serve that path on request, but only by serving the "main"
          # file, and apt refuses any index the signed Release does not
          # attest to. So with "updates/main" configured, apt fetched the
          # security InRelease, found no signed hash for the requested
          # component, and silently skipped the entire security binary index:
          # every security package was invisible to the resolver.
          # The visible symptom was
          #   perl : Depends: perl-base (= 5.32.1-4+deb11u3)
          #          but 5.32.1-4+deb11u5 is to be installed
          # because the image ships perl-base 5.32.1-4+deb11u5 preinstalled
          # (Essential: yes) while only the bullseye/main u3 perl was visible.
          # Using "main" restores the security index, which makes the u5
          # perl/perl-base pair resolvable and matching the installed base.
          printf '%s\n' \
            "# Debian Bullseye pinned to immutable snapshot.debian.org capture ${DEB_SNAPSHOT}." \
            "# Signatures are still verified against debian-archive-keyring.gpg." \
            "deb http://snapshot.debian.org/archive/debian/${DEB_SNAPSHOT} bullseye main" \
            "deb http://snapshot.debian.org/archive/debian-security/${DEB_SNAPSHOT} bullseye-security main" \
            > /etc/apt/sources.list
          rm -f /etc/apt/sources.list.d/*.list /etc/apt/sources.list.d/*.sources
          cat /etc/apt/sources.list
          echo
          echo "=== [bootstrap] apt-get update against the pinned snapshot only ==="
          apt-get -o Acquire::Check-Valid-Until=false update
          echo
          echo "=== [bootstrap] DIAGNOSTIC: active apt sources (authoritative) ==="
          grep -RhE '^[[:space:]]*deb ' /etc/apt/sources.list /etc/apt/sources.list.d/ 2>/dev/null | sort -u || true
          echo "--- any source that is NOT a pinned snapshot (must print none) ---"
          if grep -RhE '^[[:space:]]*deb ' /etc/apt/sources.list /etc/apt/sources.list.d/ 2>/dev/null \
               | grep -v 'snapshot\.debian\.org/archive/'; then
            echo "!!! UNEXPECTED NON-SNAPSHOT SOURCE ACTIVE !!!"
            exit 1
          else
            echo "OK: every active source is a pinned snapshot.debian.org capture"
          fi
          echo
          # Regression guard for the failure documented at the sources.list
          # above: when the configured security component is not attested by
          # the signed Release, apt fetches the InRelease, silently skips the
          # whole security binary index and every security package vanishes
          # from the resolver. Detect that here instead of several steps later.
          # Plain glob, no pipeline, so pipefail/SIGPIPE cannot mask the result.
          echo "=== [bootstrap] verifying the security binary index was actually fetched ==="
          shopt -s nullglob
          security_index_found=0
          for _f in /var/lib/apt/lists/*bullseye-security*binary-amd64_Packages*; do
            security_index_found=1
            break
          done
          shopt -u nullglob
          if [[ "$security_index_found" -ne 1 ]]; then
            echo "ERROR: no bullseye-security binary-amd64 index under /var/lib/apt/lists"
            echo "       the configured security component is not attested by the signed Release"
            exit 1
          fi
          echo "OK: bullseye-security binary-amd64 index is present"
          echo
          echo "=== [bootstrap] installing container prerequisites ==="
          apt-get install -y --no-install-recommends git sudo file ca-certificates
          echo
          echo "=== [bootstrap] verifying the installed perl / perl-base pair ==="
          dpkg-query -W -f='${Package} ${Version}\n' perl perl-base
          PERL_VERSION="$(dpkg-query -W -f='${Version}' perl)"
          PERL_BASE_VERSION="$(dpkg-query -W -f='${Version}' perl-base)"
          if [[ "$PERL_VERSION" != "$PERL_BASE_VERSION" ]]; then
            echo "ERROR: perl/perl-base version mismatch (perl=${PERL_VERSION} perl-base=${PERL_BASE_VERSION})"
            exit 1
          fi
          echo "OK: perl and perl-base are a matching pair: ${PERL_VERSION}"
          echo
          echo "=== [bootstrap] verifying the remaining container prerequisites ==="
          git --version
          sudo --version
          file --version
          dpkg-query -W -f='${Package} ${Version}\n' ca-certificates
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: deb
          path: build/packages
      - uses: actions/download-artifact@v4
        with:
          name: rpm
          path: build/packages
      - uses: actions/download-artifact@v4
        with:
          name: flatpak
          path: build/packages
      - name: Install repository tooling
        run: |
          set -euo pipefail
          echo "[build] Container release:"
          cat /etc/os-release
          echo "[build] Architecture:"
          dpkg --print-architecture
          echo "[build] Selected Debian snapshot: ${DEB_SNAPSHOT}"
          echo "[build] Checking apt sources..."
          grep -Rhv '^[[:space:]]*#' /etc/apt/sources.list /etc/apt/sources.list.d/*.list 2>/dev/null || true
          
          echo "[build] Updating apt metadata..."
          # Scoped to this command line: the pinned bullseye-security Release
          # carries an expired Valid-Until (see the comment on this job). This
          # suppresses only that freshness check; Release/InRelease signatures
          # are still verified normally.
          sudo apt-get -o Acquire::Check-Valid-Until=false update

          echo "[build] Candidate versions from the pinned snapshot:"
          for pkg in dpkg-sig gnupg perl; do
            apt-cache policy "$pkg"
          done
          
          echo "[build] Installing repository tooling..."
          sudo apt-get install -y --no-install-recommends apt-utils createrepo-c rpm gnupg dpkg-sig

          echo "[build] Installed tool versions:"
          command -v dpkg-sig
          # dpkg-sig has no --version option (its option table is
          # sign|list|verify|verify-role|...|help|-v), so ask dpkg instead.
          dpkg-query -W -f='${Package} ${Version}\n' dpkg-sig
          # No pipe here: `gpg --version | head -n1` can hand gpg a SIGPIPE
          # (141) under `set -o pipefail` and kill the step.
          gpg --version
          git --version
          rpm --version
          createrepo_c --version
          DPKG_SIG_VERSION="$(dpkg-query -W -f='${Version}' dpkg-sig)"
          test "$DPKG_SIG_VERSION" = "0.13.1+nmu4" || {
            echo "::error::expected dpkg-sig 0.13.1+nmu4 from the pinned snapshot, got ${DPKG_SIG_VERSION}"
            exit 1
          }

          echo "[build] Verifying repository tooling..."
          command -v gpg >/dev/null 2>&1 || {
            echo "::error::gpg is missing"
            exit 1
          }
          command -v rpm >/dev/null 2>&1 || {
            echo "::error::rpm is missing"
            exit 1
          }
          command -v createrepo_c >/dev/null 2>&1 || {
            echo "::error::createrepo_c is missing"
            exit 1
          }
          command -v apt-ftparchive >/dev/null 2>&1 || {
            echo "::error::apt-ftparchive is missing"
            exit 1
          }
          command -v dpkg-sig >/dev/null 2>&1 || {
            echo "::error::dpkg-sig is missing"
            exit 1
          }
          echo "[build] Repository tooling verified"
      - name: Import GPG signing key
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_KEY_ID: ${{ secrets.GPG_KEY_ID }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: bash scripts/setup-gpg.sh
      - name: Sign .deb (dpkg-sig)
        env:
          GPG_KEY_ID: ${{ secrets.GPG_KEY_ID }}
        run: |
          shopt -s nullglob
          for f in build/packages/retro-tv_*.deb; do
            dpkg-sig --sign builder -k "$GPG_KEY_ID" "$f"
          done
      - name: Sign .rpm (rpmsign)
        env:
          GPG_KEY_ID: ${{ secrets.GPG_KEY_ID }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          unset GPG_TTY
          GPG_BIN="$(command -v gpg)"
          test -x "$GPG_BIN"
          echo "[build] RPM signing with $GPG_BIN"
          shopt -s nullglob
          for f in build/packages/retro-tv-*.rpm; do
            rpmsign --define "__gpg $GPG_BIN" --define "%_gpg_name $GPG_KEY_ID" --define "%_gpg_passphrase $GPG_PASSPHRASE" --addsign "$f"
          done
      - name: Generate SHA256SUMS
        run: |
          shopt -s nullglob
          cd build/packages
          sha256sum *.deb *.rpm *.flatpak > SHA256SUMS
          cat SHA256SUMS
      - name: Generate signed APT repository
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_KEY_ID: ${{ secrets.GPG_KEY_ID }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: bash scripts/generate-apt-repository.sh
      - name: Generate signed DNF repository
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_KEY_ID: ${{ secrets.GPG_KEY_ID }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: bash scripts/generate-dnf-repository.sh
      - name: Verify release artifacts
        run: bash scripts/verify-release.sh
      - uses: actions/upload-artifact@v4
        with:
          name: repository
          path: build/repository
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: packages
          path: build/packages
          if-no-files-found: error

  # The .deb is built on Ubuntu 24.04 and depends on its libmpv2 ABI. Bullseye
  # provides libmpv1 instead, so exercise APT installation on the target Ubuntu.
  test-apt-install:
    needs: [resolve-version, sign-and-verify]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: repository
          path: build/repository
      - name: Install test utility
        run: sudo apt-get update -qq && sudo apt-get install -y -qq file
      - name: Ubuntu end-to-end install test
        env:
          NV: ${{ needs.resolve-version.outputs.name }}
          NC: ${{ needs.resolve-version.outputs.code }}
        run: sudo bash scripts/test-apt-install.sh "$PWD/build/repository/apt" "$NV" "$NC"

  # Fedora/RHEL install test in a real fedora container. Runs AFTER signing so
  # it validates the exact signed repository that will be published.
  test-fedora-install:
    needs: sign-and-verify
    runs-on: ubuntu-24.04
    container: fedora:42
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: repository
          path: build/repository
      - name: Fedora end-to-end install test
        run: bash scripts/test-dnf-install.sh "$PWD/build/repository/dnf"

  publish:
    # This job is the ONLY irreversible part of the pipeline: it deploys
    # GitHub Pages and creates a public GitHub Release with package assets.
    #
    # Tag pushes (the real release path) always publish, exactly as before.
    # A manual workflow_dispatch run publishes ONLY when publish_release is
    # explicitly set to true, so a CI validation run cannot publish anything.
    if: github.event_name != 'workflow_dispatch' || inputs.publish_release == true
    needs: [resolve-version, sign-and-verify, test-apt-install, test-fedora-install]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: repository
          path: build/repository
      - uses: actions/download-artifact@v4
        with:
          name: packages
          path: build/packages
      - name: Create version tag for manual publish
        if: github.event_name == 'workflow_dispatch' && inputs.publish_release == true && github.ref_type != 'tag'
        env:
          RELEASE_TAG: v${{ needs.resolve-version.outputs.name }}
        run: |
          if ! existing_tag_refs="$(git ls-remote --tags origin "refs/tags/$RELEASE_TAG" "refs/tags/$RELEASE_TAG^{}")"; then
            echo "::error::Could not query origin for tag $RELEASE_TAG; check GitHub connectivity and permissions."
            exit 1
          fi
          existing_tag_sha="$(printf '%s\n' "$existing_tag_refs" | awk -v tag_ref="refs/tags/$RELEASE_TAG" '$2 == tag_ref "^{}" { peeled = $1 } $2 == tag_ref { direct = $1 } END { print peeled ? peeled : direct }')"
          if [[ -n "$existing_tag_sha" ]]; then
            if [[ "$existing_tag_sha" != "$GITHUB_SHA" ]]; then
              echo "::error::Tag $RELEASE_TAG already points to $existing_tag_sha, not $GITHUB_SHA. Bump pubspec.yaml to a new release version before publishing these artifacts."
              exit 1
            fi
            echo "[release] reusing $RELEASE_TAG at $GITHUB_SHA"
          else
            git tag "$RELEASE_TAG" "$GITHUB_SHA"
            git push origin "refs/tags/$RELEASE_TAG"
            echo "[release] created $RELEASE_TAG at $GITHUB_SHA"
          fi
      - name: Create GitHub Release with assets
        if: github.ref_type == 'tag' || (github.event_name == 'workflow_dispatch' && inputs.publish_release == true)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || format('v{0}', needs.resolve-version.outputs.name) }}
          target_commitish: ${{ github.sha }}
          name: Retro TV ${{ needs.resolve-version.outputs.full }}
          body: >
            Linux release ${{ needs.resolve-version.outputs.full }} (amd64).
            Install instructions: https://mzainulabideendev.github.io/Retro-TV/
          files: |
            build/packages/*.deb
            build/packages/*.rpm
            build/packages/*.flatpak
            build/packages/SHA256SUMS
          draft: false
          prerelease: false
      - name: Assemble GitHub Pages site
        run: bash scripts/generate-ghpages.sh
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/gh-pages
      - name: Publish Pages
        uses: actions/deploy-pages@v4