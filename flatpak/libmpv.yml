# libmpv build for Retro TV Flatpak.
#
# This mirrors the module set proven on Flathub by
# io.github.yuki_iptv.yuki-iptv (a Flutter + media_kit app that also links
# libmpv into its Flatpak). mpv >= 0.34 requires libplacebo; that in turn
# requires shaderc, which the runtime ships broken, so shaderc is built too.
#
# Lua, vapoursynth, yt-dlp and other script/video-filter extras are omitted on
# purpose: Retro TV only uses the mpv playback core through libmpv.
name: libmpv
cleanup:
  - /share/bash-completion
  - /share/zsh
  - /share/doc
  - /share/icons
  - /share/applications
buildsystem: meson
config-opts:
  - -Dlibmpv=true
  - -Dcplayer=false
  - -Dlua=disabled
  - -Ddebug=false
  - -Dbuild-date=false
  - -Dalsa=disabled
  - -Dmanpage-build=disabled
  - -Dvulkan=enabled
  - -Dx11=enabled
  - -Dwayland=enabled
  - -Ddrm=enabled
sources:
  - type: archive
    url: https://github.com/mpv-player/mpv/archive/refs/tags/v0.40.0.tar.gz
    sha256: 10a0f4654f62140a6dd4d380dcf0bbdbdcf6e697556863dc499c296182f081a3
    x-checker-data:
      type: anitya
      project-id: 5348
      stable-only: true
      url-template: https://github.com/mpv-player/mpv/archive/refs/tags/v$version.tar.gz

  - name: libplacebo
    buildsystem: meson
    config-opts:
      - -Dopengl=enabled
      - -Dvulkan=enabled
      - -Dglslang=disabled
      - -Dd3d11=disabled
      - -Ddemos=false
    cleanup:
      - /include
      - /lib/pkgconfig
    sources:
      - type: git
        url: https://github.com/haasn/libplacebo.git
        tag: v7.351.0
        commit: 3188549fba13bbdf3a5a98de2a38c2e71f04e21e
        x-checker-data:
          type: git
          tag-pattern: ^v([\d.]+)$
    modules:
      # runtime shaderc is broken for mpv build.
      # OSError: /usr/lib/x86_64-linux-gnu/libshaderc_shared.so.1: undefined symbol: _ZTVN8spvtools5utils5TimerE
      - name: shaderc
        buildsystem: cmake-ninja
        builddir: true
        config-opts:
          - -DSHADERC_SKIP_COPYRIGHT_CHECK=ON
          - -DSHADERC_SKIP_EXAMPLES=ON
          - -DSHADERC_SKIP_TESTS=ON
          - -DSPIRV_SKIP_EXECUTABLES=ON
          - -DENABLE_GLSLANG_BINARIES=OFF
        cleanup:
          - /bin
          - /include
          - /lib/cmake
          - /lib/pkgconfig
        sources:
          - type: git
            url: https://github.com/google/shaderc.git
            tag: v2025.5
            commit: c4b0af6c3664cd8b33ffddf452514e02a173b4d6
            x-checker-data:
              type: git
              tag-pattern: ^v(\d{4}\.\d{1,2})$
          - type: git
            url: https://github.com/KhronosGroup/SPIRV-Headers.git
            tag: vulkan-sdk-1.4.328.1
            commit: 01e0577914a75a2569c846778c2f93aa8e6feddd
            dest: third_party/spirv-headers
            x-checker-data:
              type: git
              tag-pattern: ^vulkan-sdk-([\d.]+)$
          - type: git
            url: https://github.com/KhronosGroup/SPIRV-Tools.git
            tag: vulkan-sdk-1.4.328.1
            commit: 7f2d9ee926f98fc77a3ed1e1e0f113b8c9c49458
            dest: third_party/spirv-tools
            x-checker-data:
              type: git
              tag-pattern: ^vulkan-sdk-([\d.]+)$
          - type: git
            url: https://github.com/KhronosGroup/glslang.git
            tag: vulkan-sdk-1.4.328.1
            commit: a57276bf558f5cf94d3a9854ebdf5a2236849a5a
            dest: third_party/glslang
            x-checker-data:
              type: git
              tag-pattern: ^vulkan-sdk-([\d.]+)$

  - name: libXpresent
    buildsystem: autotools
    sources:
      - type: archive
        url: https://xorg.freedesktop.org/archive/individual/lib/libXpresent-1.0.2.tar.xz
        sha256: 4e5b21b4812206a4b223013606ae31170502c1043038777a1ef8f70c09d37602
        x-checker-data:
          type: anitya
          project-id: 17166
          stable-only: true
          url-template: https://xorg.freedesktop.org/archive/individual/lib/libXpresent-$version.tar.xz

  - name: libass
    config-opts:
      - --disable-static
    sources:
      - type: archive
        url: https://github.com/libass/libass/releases/download/0.17.4/libass-0.17.4.tar.gz
        sha256: a886b3b80867f437bc55cff3280a652bfa0d37b43d2aff39ddf3c4f288b8c5a8
        x-checker-data:
          type: anitya
          project-id: 1560
          stable-only: true
          url-template: https://github.com/libass/libass/releases/download/$version/libass-$version.tar.gz

  - name: uchardet
    buildsystem: cmake-ninja
    config-opts:
      - -DCMAKE_POLICY_VERSION_MINIMUM=3.5
      - -DCMAKE_BUILD_TYPE=Release
      - -DBUILD_STATIC=0
    cleanup:
      - /bin
    sources:
      - type: archive
        url: https://www.freedesktop.org/software/uchardet/releases/uchardet-0.0.8.tar.xz
        sha256: e97a60cfc00a1c147a674b097bb1422abd9fa78a2d9ce3f3fdcc2e78a34ac5f0
        x-checker-data:
          type: anitya
          project-id: 9265
          stable-only: true
          url-template: https://www.freedesktop.org/software/uchardet/releases/uchardet-$version.tar.xz

  # Needed for mpv 0.40 vaapi support
  - name: libdisplay-info
    buildsystem: meson
    sources:
      - type: archive
        url: https://gitlab.freedesktop.org/emersion/libdisplay-info/-/archive/0.2.0/libdisplay-info-0.3.0.tar.gz
        sha256: a0fe86d4b43a6347cdd8192f307d19b81d31401fe55251be0576bdbe0b519d7f
        x-checker-data:
          type: anitya
          project-id: 326668
          stable-only: true
          url-template: https://gitlab.freedesktop.org/emersion/libdisplay-info/-/archive/0.2.0/libdisplay-info-$version.tar.gz
    modules:
      - name: hwdata
        sources:
          - type: archive
            url: https://github.com/vcrhonek/hwdata/archive/refs/tags/v0.402.tar.gz
            sha256: e390fe2f5f5ef7ed9ccbe62eb7cd40d4ee2b57389e7869c0dc96433c81812e7a
            x-checker-data:
              type: anitya
              project-id: 5387
              stable-only: true
              url-template: https://github.com/vcrhonek/hwdata/archive/refs/tags/v$version.tar.gz